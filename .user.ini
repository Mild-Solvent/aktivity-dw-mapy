; PHP per-dir overrides for aktivity-dw-mapy on Websupport.
;
; upload_max_filesize + post_max_size must clear the 25 MB upload cap from
; api/_lib/files.php with headroom for multipart overhead. display_errors=off
; keeps server-side errors from leaking through to the JSON response layer.
;
; This file is read by PHP as the per-directory INI for the docroot — Websupport
; honors .user.ini on its PHP-FPM stack.

upload_max_filesize = 26M
post_max_size       = 28M
max_execution_time  = 60
display_errors      = Off
log_errors          = On
error_log           = /tmp/php-errors.log
